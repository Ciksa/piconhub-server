name: Hash update payload
on:
  push:
    paths:
      - 'plugin-update/files/**'
      - '.github/workflows/hash-update-payload.yml'
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SHA256
        run: sha256sum plugin-update/files/release.py plugin-update/files/__init__.py plugin-update/files/update_menu_patch.py
