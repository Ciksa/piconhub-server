name: Remove redundant satellite level
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-satellite-level.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Flatten satellite directories and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, json, re
          root=Path('.')
          picons=root/'picons'
          moved=[]
          for pos in sorted(picons.iterdir()):
              sat=pos/'satellite'
              if not sat.is_dir(): continue
              for style in ('transparent','white','black'):
                  src=sat/style
                  if not src.is_dir(): raise SystemExit(f'Missing {src}')
                  dst=pos/style
                  if dst.exists(): raise SystemExit(f'Collision: {dst}')
                  shutil.move(str(src),str(dst))
              sat.rmdir()
              moved.append(pos.name)
          if not moved: raise SystemExit('No satellite directories found')
          # Rewrite all repository references.
          for f in root.rglob('*'):
              if not f.is_file() or '.git' in f.parts: continue
              data=f.read_bytes(); new=data
              for pos in moved:
                  new=new.replace(f'picons/{pos}/satellite/'.encode(),f'picons/{pos}/'.encode())
              if new!=data: f.write_bytes(new)
          # Validate no redundant satellite path remains.
          bad=[]
          for f in root.rglob('*'):
              if not f.is_file() or '.git' in f.parts: continue
              data=f.read_bytes()
              if b'/satellite/' in data and b'picons/' in data: bad.append(str(f))
          if bad: raise SystemExit('Old satellite references remain: '+', '.join(bad[:20]))
          if list(picons.glob('*/satellite')): raise SystemExit('satellite directories remain')
          # Generic orbital packages now have styles directly under position; provider packages stay unchanged.
          req={'transparent','white','black'}
          for pos in picons.iterdir():
              if not pos.is_dir(): continue
              direct={x.name for x in pos.iterdir() if x.is_dir()}
              if req & direct and not req <= direct: raise SystemExit(f'Incomplete direct styles: {pos}')
          # JSON remains parseable and manifest raw picon URLs resolve locally.
          json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          prefix='https://raw.githubusercontent.com/PiconHub-Warder/piconhub-server/main/'
          missing=[]; count=0
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
              elif isinstance(x,str): yield x
          for mf in (root/'manifests').rglob('*.json'):
              obj=json.loads(mf.read_text(encoding='utf-8'))
              for s in walk(obj):
                  if s.startswith(prefix) and '/picons/' in s:
                      count+=1; rel=s[len(prefix):].split('?',1)[0]
                      if not Path(rel).is_file(): missing.append((str(mf),rel))
          if missing: raise SystemExit(f'{len(missing)} broken manifest URLs: {missing[:10]}')
          print('POSITIONS_FLATTENED='+str(len(moved)))
          print('MANIFEST_PICON_URLS_VALIDATED='+str(count))
          print('SATELLITE_LEVEL_REMOVED=1')
          PY
      - name: Commit clean result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-satellite-level.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'PiconHub-Warder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset --soft HEAD^
          git commit -m 'Remove redundant satellite hierarchy level'
          git push --force-with-lease origin HEAD:main
